name: FitCrew Deployment v2 Certified Delta + Manifest-Owned Deletion Proof

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/deploy-v2-proof.yaml'
      - '.github/deployment/**'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Proof, D2-2 non-deleting deploy, D2-3 deletion dry run, or D2-4 exact manifest-owned deletion'
        required: true
        default: 'proof'
        type: choice
        options:
          - proof
          - d2-2
          - d2-3
          - d2-4
      confirmation:
        description: 'For d2-2: DEPLOY-NON-DELETING. For d2-4: DELETE-MANIFEST-OWNED.'
        required: false
        type: string
      deletion_plan_sha256:
        description: 'For d2-4 only: exact plan-identity SHA-256 returned by the prior clean D2-3 run'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'd2-2' || inputs.phase == 'd2-4') && 'fitcrew-production' || 'fitcrew-deployment-v2-proof' }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove certified delta, exact transfer, and manifest-owned deletion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_HOST: ruffener.com
      SSH_USER: ruffener
      SSH_PASS: ${{ secrets.SFTP_PASS }}
      SSH_PORT: '22'
      PROD_PATH: ${{ secrets.PROD_PATH }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      APP_URL: https://fitcrewchallenge.com

    steps:
      - name: Checkout Deployment v2 candidate
        uses: actions/checkout@v6
        with:
          path: proof-repo

      - name: Checkout exact current main payload source with history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          path: production-source

      - name: Record exact main source identity
        id: main_source
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C production-source fetch --quiet origin main
          commit="$(git -C production-source rev-parse HEAD)"
          origin_main="$(git -C production-source rev-parse FETCH_HEAD)"
          test -n "$commit"
          test "$commit" = "$origin_main"
          test -z "$(git -C production-source status --porcelain)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf 'Production payload source commit: `%s`\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
          printf 'Exact origin/main synchronization inside proof runner: **PASS**\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Authorize D2-2 invocation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'd2-2' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ github.ref_name }}" == "develop" ]] || {
            echo "D2-2 proof implementation must run from develop." >&2
            exit 1
          }
          [[ "${{ inputs.confirmation }}" == "DEPLOY-NON-DELETING" ]] || {
            echo "D2-2 confirmation phrase did not match." >&2
            exit 1
          }
          echo 'D2-2 operator confirmation: **PASS / NON-DELETING ONLY**' >> "$GITHUB_STEP_SUMMARY"

      - name: Authorize D2-3 invocation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'd2-3' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ github.ref_name }}" == "develop" ]] || {
            echo "D2-3 proof implementation must run from develop." >&2
            exit 1
          }
          echo 'D2-3 operator invocation: **PASS / DRY RUN ONLY**' >> "$GITHUB_STEP_SUMMARY"

      - name: Authorize D2-4 invocation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'd2-4' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ github.ref_name }}" == "develop" ]] || {
            echo "D2-4 proof implementation must run from develop." >&2
            exit 1
          }
          [[ "${{ inputs.confirmation }}" == "DELETE-MANIFEST-OWNED" ]] || {
            echo "D2-4 confirmation phrase did not match." >&2
            exit 1
          }
          [[ "${{ inputs.deletion_plan_sha256 }}" =~ ^[0-9a-f]{64}$ ]] || {
            echo "D2-4 requires the exact 64-character SHA-256 returned by the prior D2-3 proof." >&2
            exit 1
          }
          echo 'D2-4 operator confirmation: **PASS / EXACT MANIFEST-OWNED DELETION ONLY**' >> "$GITHUB_STEP_SUMMARY"

      - name: Install runner SSH password helper
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          command -v sshpass >/dev/null
          command -v rsync >/dev/null

      - name: D2-0 — read-only GitHub SSH credential probe
        shell: bash
        run: |
          set -Eeuo pipefail
          proof-repo/.github/deployment/deploy-v2-proof.sh probe

      - name: Read current deployment certification
        id: cert_status
        shell: bash
        run: |
          set -Eeuo pipefail
          proof_dir="$RUNNER_TEMP/fitcrew-deployment-proof"
          mkdir -p "$proof_dir"
          proof-repo/.github/deployment/deploy-v2-proof.sh cert-status "" "$proof_dir"

          available="$(sed -n 's/^CERT_AVAILABLE=//p' "$proof_dir/cert-status.txt")"
          reason="$(sed -n 's/^CERT_REASON=//p' "$proof_dir/cert-status.txt")"
          certified_commit="$(sed -n 's/^GIT_COMMIT=//p' "$proof_dir/cert-status.txt")"
          vendor_input="$(sed -n 's/^VENDOR_INPUT_SHA256=//p' "$proof_dir/cert-status.txt")"
          vendor_manifest="$(sed -n 's/^VENDOR_MANIFEST_SHA256=//p' "$proof_dir/cert-status.txt")"
          vendor_count="$(sed -n 's/^VENDOR_FILE_COUNT=//p' "$proof_dir/cert-status.txt")"
          vendor_bytes="$(sed -n 's/^VENDOR_BYTES=//p' "$proof_dir/cert-status.txt")"

          [[ "$available" == "0" || "$available" == "1" ]]
          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "certified_commit=$certified_commit" >> "$GITHUB_OUTPUT"
          echo "vendor_input=$vendor_input" >> "$GITHUB_OUTPUT"
          echo "vendor_manifest=$vendor_manifest" >> "$GITHUB_OUTPUT"
          echo "vendor_count=${vendor_count:-0}" >> "$GITHUB_OUTPUT"
          echo "vendor_bytes=${vendor_bytes:-0}" >> "$GITHUB_OUTPUT"

      - name: Classify Git delta from certified production to current main
        id: delta
        shell: bash
        env:
          CERT_AVAILABLE: ${{ steps.cert_status.outputs.available }}
          CERTIFIED_COMMIT: ${{ steps.cert_status.outputs.certified_commit }}
          MAIN_COMMIT: ${{ steps.main_source.outputs.commit }}
        run: |
          set -Eeuo pipefail
          proof_dir="$RUNNER_TEMP/fitcrew-deployment-proof"
          mkdir -p "$proof_dir"

          if [[ "$CERT_AVAILABLE" != "1" ]]; then
            : > "$proof_dir/changed-production-files.txt"
            : > "$proof_dir/deleted-production-files.txt"
            : > "$proof_dir/change-scope.tsv"
            echo 'noop=0' >> "$GITHUB_OUTPUT"
            echo 'certified_chain=0' >> "$GITHUB_OUTPUT"
            echo 'changed_total=unknown' >> "$GITHUB_OUTPUT"
            echo 'production_changed=unknown' >> "$GITHUB_OUTPUT"
            echo 'production_deleted=unknown' >> "$GITHUB_OUTPUT"
            echo 'vendor_sensitive=1' >> "$GITHUB_OUTPUT"
            echo 'vendor_reason=uncertified-full-fallback' >> "$GITHUB_OUTPUT"
            {
              echo
              echo '## Certified delta classification'
              echo
              echo '- Existing deployment certification: **UNAVAILABLE**'
              echo '- Fast delta chain: **UNAVAILABLE / FULL FALLBACK REQUIRED**'
              echo '- Vendor path: **FULL COMPOSER BUILD REQUIRED / UNCERTIFIED BASELINE**'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git -C production-source cat-file -e "$CERTIFIED_COMMIT^{commit}" || {
            echo "Certified production commit is not available in main history: $CERTIFIED_COMMIT" >&2
            exit 31
          }
          git -C production-source merge-base --is-ancestor "$CERTIFIED_COMMIT" "$MAIN_COMMIT" || {
            echo "Certified production commit is not an ancestor of current main; refusing fast-chain deployment." >&2
            exit 32
          }

          if [[ "$CERTIFIED_COMMIT" == "$MAIN_COMMIT" ]]; then
            : > "$proof_dir/changed-production-files.txt"
            : > "$proof_dir/deleted-production-files.txt"
            : > "$proof_dir/change-scope.tsv"
            echo 'noop=1' >> "$GITHUB_OUTPUT"
            echo 'certified_chain=1' >> "$GITHUB_OUTPUT"
            echo 'changed_total=0' >> "$GITHUB_OUTPUT"
            echo 'production_changed=0' >> "$GITHUB_OUTPUT"
            echo 'production_deleted=0' >> "$GITHUB_OUTPUT"
            echo 'vendor_sensitive=0' >> "$GITHUB_OUTPUT"
            echo 'vendor_reason=no-git-delta' >> "$GITHUB_OUTPUT"
            {
              echo
              echo '## Certified delta classification'
              echo
              printf -- '- Certified production commit: `%s`\n' "$CERTIFIED_COMMIT"
              echo '- Git changes since certification: **0**'
              echo '- Deployment action: **NO-OP / ALREADY CERTIFIED**'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - "$CERTIFIED_COMMIT" "$MAIN_COMMIT" "$GITHUB_WORKSPACE/production-source" "$proof_dir" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          base, target, repo, proof = sys.argv[1:]
          repo = Path(repo)
          proof = Path(proof)

          excluded_exact = {
              '.gitignore', 'README.md', 'CHANGED_FILES.txt',
              'DELETE_THESE_FILES.txt', 'PHASE1B_ROOT_APPLY.txt'
          }
          excluded_prefixes = (
              '.deploy/', '.git/', '.github/', 'docs/', 'tests/', 'branding/'
          )

          def forbidden(path: str) -> bool:
              return path == '.env' or path.startswith('.env.')

          def production_path(path: str) -> bool:
              if forbidden(path):
                  raise SystemExit(f'Forbidden tracked .env boundary change detected: {path}')
              if path in excluded_exact or path.startswith(excluded_prefixes):
                  return False
              return True

          # Current FitCrew Composer contract:
          #   autoload.psr-4: FitCrew\\ => inc/
          #   composer install --optimize-autoloader
          # Therefore Composer output changes for root-package source only when the
          # optimized class inventory/path mapping changes. Ordinary method/body
          # edits in an existing inc/*.php file do not require Composer.
          namespace_re = re.compile(r'(?m)^\s*namespace\s+([A-Za-z_\\][A-Za-z0-9_\\]*)\s*[;{]')
          class_re = re.compile(r'(?m)^\s*(?:(?:abstract|final|readonly)\s+)*(class|interface|trait|enum)\s+([A-Za-z_][A-Za-z0-9_]*)\b')

          def git_bytes(commit: str, path: str) -> bytes:
              return subprocess.check_output(['git', '-C', str(repo), 'show', f'{commit}:{path}'])

          def class_inventory(commit: str, path: str):
              try:
                  text = git_bytes(commit, path).decode('utf-8', 'replace')
              except subprocess.CalledProcessError:
                  return ()
              namespaces = namespace_re.findall(text)
              namespace = namespaces[0].rstrip('\\') if namespaces else ''
              symbols = []
              for kind, name in class_re.findall(text):
                  fqcn = f'{namespace}\\{name}' if namespace else name
                  symbols.append((kind, fqcn))
              return tuple(sorted(symbols))

          raw = subprocess.check_output(
              ['git', '-C', str(repo), 'diff', '--name-status', '-M', '-z', base, target]
          )
          items = raw.split(b'\0')
          i = 0
          records = []
          changed_target = set()
          deleted = set()
          vendor_reasons = set()
          total = 0

          def note_vendor_change(code: str, old: str, new: str = '') -> None:
              paths = [p for p in (old, new) if p]
              if any(p in ('composer.json', 'composer.lock') for p in paths):
                  vendor_reasons.add('composer-metadata-changed')
                  return
              inc_php = [p for p in paths if p.startswith('inc/') and p.endswith('.php')]
              if not inc_php:
                  return
              if code in ('A', 'D', 'R', 'C'):
                  vendor_reasons.add('optimized-psr4-class-path-set-changed')
                  return
              if code == 'M' and old == new:
                  if class_inventory(base, old) != class_inventory(target, new):
                      vendor_reasons.add('optimized-psr4-class-inventory-changed')

          while i < len(items) and items[i]:
              status = items[i].decode('utf-8', 'surrogateescape')
              i += 1
              total += 1
              code = status[0]
              if code in ('R', 'C'):
                  old = items[i].decode('utf-8', 'surrogateescape'); i += 1
                  new = items[i].decode('utf-8', 'surrogateescape'); i += 1
                  records.append((status, old, new))
                  note_vendor_change(code, old, new)
                  if code == 'R' and production_path(old):
                      deleted.add(old)
                  if production_path(new) and (repo / new).is_file():
                      changed_target.add(new)
              else:
                  path = items[i].decode('utf-8', 'surrogateescape'); i += 1
                  records.append((status, path, ''))
                  note_vendor_change(code, path, path)
                  if code == 'D':
                      if production_path(path):
                          deleted.add(path)
                  elif production_path(path) and (repo / path).is_file():
                      changed_target.add(path)

          (proof / 'change-scope.tsv').write_text(
              ''.join('\t'.join(r) + '\n' for r in records), encoding='utf-8'
          )
          (proof / 'changed-production-files.txt').write_text(
              ''.join(p + '\n' for p in sorted(changed_target)), encoding='utf-8'
          )
          (proof / 'deleted-production-files.txt').write_text(
              ''.join(p + '\n' for p in sorted(deleted)), encoding='utf-8'
          )
          reason = ','.join(sorted(vendor_reasons)) if vendor_reasons else 'composer-output-inputs-unchanged'
          (proof / 'delta-counts.env').write_text(
              f'changed_total={total}\n'
              f'production_changed={len(changed_target)}\n'
              f'production_deleted={len(deleted)}\n'
              f'vendor_sensitive={1 if vendor_reasons else 0}\n'
              f'vendor_reason={reason}\n', encoding='utf-8'
          )
          PY

          changed_total="$(sed -n 's/^changed_total=//p' "$proof_dir/delta-counts.env")"
          production_changed="$(sed -n 's/^production_changed=//p' "$proof_dir/delta-counts.env")"
          production_deleted="$(sed -n 's/^production_deleted=//p' "$proof_dir/delta-counts.env")"
          vendor_sensitive="$(sed -n 's/^vendor_sensitive=//p' "$proof_dir/delta-counts.env")"
          vendor_reason="$(sed -n 's/^vendor_reason=//p' "$proof_dir/delta-counts.env")"
          echo 'noop=0' >> "$GITHUB_OUTPUT"
          echo 'certified_chain=1' >> "$GITHUB_OUTPUT"
          echo "changed_total=$changed_total" >> "$GITHUB_OUTPUT"
          echo "production_changed=$production_changed" >> "$GITHUB_OUTPUT"
          echo "production_deleted=$production_deleted" >> "$GITHUB_OUTPUT"
          echo "vendor_sensitive=$vendor_sensitive" >> "$GITHUB_OUTPUT"
          echo "vendor_reason=$vendor_reason" >> "$GITHUB_OUTPUT"

          {
            echo
            echo '## Certified delta classification'
            echo
            printf -- '- Certified production commit: `%s`\n' "$CERTIFIED_COMMIT"
            printf -- '- Target main commit: `%s`\n' "$MAIN_COMMIT"
            printf -- '- Git change records: `%s`\n' "$changed_total"
            printf -- '- Production additions/modifications requiring upload consideration: `%s`\n' "$production_changed"
            printf -- '- Production removals requiring manifest-ownership classification: `%s`\n' "$production_deleted"
            echo '- Certified commit ancestry: **PASS**'
            printf -- '- Composer/vendor sensitivity: `%s` / `%s`\n' "$vendor_sensitive" "$vendor_reason"
            echo '- Current FitCrew optimized PSR-4 source root: `inc/`'
            echo '- Ordinary `inc/*.php` body edits with unchanged declared class inventory: **NOT vendor-sensitive**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop early when current main is already certified
        if: ${{ steps.delta.outputs.noop == '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Current main already equals the certified production commit. No payload construction, Composer, rsync, or remote hashing is required.'

      - name: Determine certified vendor reuse from exact Git classification
        if: ${{ steps.delta.outputs.noop != '1' }}
        id: vendor_status
        shell: bash
        env:
          CERTIFIED_CHAIN: ${{ steps.delta.outputs.certified_chain }}
          VENDOR_SENSITIVE: ${{ steps.delta.outputs.vendor_sensitive }}
          CERT_VENDOR_INPUT: ${{ steps.cert_status.outputs.vendor_input }}
          CERT_VENDOR_MANIFEST: ${{ steps.cert_status.outputs.vendor_manifest }}
          CERT_VENDOR_COUNT: ${{ steps.cert_status.outputs.vendor_count }}
          CERT_VENDOR_BYTES: ${{ steps.cert_status.outputs.vendor_bytes }}
        run: |
          set -Eeuo pipefail
          proof_dir="$RUNNER_TEMP/fitcrew-deployment-proof"
          if [[ "$CERTIFIED_CHAIN" == '1' && "$VENDOR_SENSITIVE" == '0' ]]; then
            [[ "$CERT_VENDOR_INPUT" =~ ^[0-9a-f]{64}$ ]]
            [[ "$CERT_VENDOR_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
            printf '%s\n' "$CERT_VENDOR_INPUT" > "$proof_dir/vendor-input.sha256"
            echo 'fast=1' >> "$GITHUB_OUTPUT"
            echo 'reason=exact-git-classification-proves-composer-output-unchanged' >> "$GITHUB_OUTPUT"
            echo "vendor_sha=$CERT_VENDOR_MANIFEST" >> "$GITHUB_OUTPUT"
            echo "vendor_count=${CERT_VENDOR_COUNT:-0}" >> "$GITHUB_OUTPUT"
            echo "vendor_bytes=${CERT_VENDOR_BYTES:-0}" >> "$GITHUB_OUTPUT"
            {
              echo
              echo '## Vendor decision'
              echo
              echo '- Composer/vendor rebuild in CI: **SKIPPED**'
              echo '- Reason: **exact Git classification proves Composer-generated output inputs unchanged**'
              echo '- Certified vendor byte re-hash: **SKIPPED / CERTIFIED CONTINUITY REUSED**'
              printf -- '- Certified vendor manifest SHA-256: `%s`\n' "$CERT_VENDOR_MANIFEST"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'fast=0' >> "$GITHUB_OUTPUT"
            echo 'reason=vendor-sensitive-or-uncertified' >> "$GITHUB_OUTPUT"
            echo 'vendor_sha=' >> "$GITHUB_OUTPUT"
            echo 'vendor_count=0' >> "$GITHUB_OUTPUT"
            echo 'vendor_bytes=0' >> "$GITHUB_OUTPUT"
            {
              echo
              echo '## Vendor decision'
              echo
              printf -- '- Composer/vendor rebuild in CI: **REQUIRED** / `%s`\n' '${{ steps.delta.outputs.vendor_reason }}'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fingerprint Composer build inputs only when vendor rebuild is required
        if: ${{ steps.delta.outputs.noop != '1' && steps.vendor_status.outputs.fast != '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          proof-repo/.github/deployment/build-production-payload.sh fingerprint \
            "$GITHUB_WORKSPACE/production-source" \
            "$RUNNER_TEMP/fitcrew-deployment-proof"

      - name: Setup PHP and Composer only when vendor inputs changed
        if: ${{ steps.delta.outputs.noop != '1' && steps.vendor_status.outputs.fast != '1' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Construct exact main production dependencies only when required
        if: ${{ steps.delta.outputs.noop != '1' && steps.vendor_status.outputs.fast != '1' }}
        shell: bash
        working-directory: production-source
        run: |
          set -Eeuo pipefail
          composer validate --no-check-publish --strict
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          test -f vendor/autoload.php
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Build canonical application identity
        if: ${{ steps.delta.outputs.noop != '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ '${{ steps.vendor_status.outputs.fast }}' == '1' ]]; then
            vendor_mode='app-only'
            vendor_sha='${{ steps.vendor_status.outputs.vendor_sha }}'
            vendor_count='${{ steps.vendor_status.outputs.vendor_count }}'
            vendor_bytes='${{ steps.vendor_status.outputs.vendor_bytes }}'
          else
            vendor_mode='full'
            vendor_sha=''
            vendor_count='0'
            vendor_bytes='0'
          fi

          proof-repo/.github/deployment/build-production-payload.sh build \
            "$GITHUB_WORKSPACE/production-source" \
            "$RUNNER_TEMP/fitcrew-production-payload" \
            "$RUNNER_TEMP/fitcrew-deployment-proof" \
            "$vendor_mode" \
            "$vendor_sha" \
            "$vendor_count" \
            "$vendor_bytes"

          {
            echo
            echo '## Canonical payload identity'
            echo
            printf -- '- Exact main commit: `%s`\n' '${{ steps.main_source.outputs.commit }}'
            while IFS='=' read -r key value; do
              printf -- '- %s: `%s`\n' "$key" "$value"
            done < "$RUNNER_TEMP/fitcrew-deployment-proof/payload-summary.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: D2-1 — Git-diff-scoped rsync dry run / no delete
        if: ${{ steps.delta.outputs.noop != '1' }}
        shell: bash
        env:
          VENDOR_FAST: ${{ steps.vendor_status.outputs.fast }}
        run: |
          set -Eeuo pipefail
          if [[ "$VENDOR_FAST" == '1' && '${{ steps.delta.outputs.certified_chain }}' == '1' ]]; then
            export RSYNC_FILE_LIST="$RUNNER_TEMP/fitcrew-deployment-proof/changed-production-files.txt"
          fi
          proof-repo/.github/deployment/deploy-v2-proof.sh dry-run \
            "$RUNNER_TEMP/fitcrew-production-payload" \
            "$RUNNER_TEMP/fitcrew-deployment-proof"

      - name: D2-2 — build read-only retirement plan when the target may obsolete owned files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'd2-2' && steps.delta.outputs.noop != '1' && steps.delta.outputs.certified_chain == '1' && (steps.delta.outputs.production_deleted != '0' || steps.vendor_status.outputs.fast != '1') }}
        shell: bash
        env:
          CERTIFIED_COMMIT: ${{ steps.cert_status.outputs.certified_commit }}
          MAIN_COMMIT: ${{ steps.main_source.outputs.commit }}
          PLAN_PHASE_LABEL: D2-2 safety check
        run: |
          set -Eeuo pipefail
          proof-repo/.github/deployment/deploy-v2-proof.sh manifest-delete-plan \
            "$RUNNER_TEMP/fitcrew-production-payload" \
            "$RUNNER_TEMP/fitcrew-deployment-proof"

      - name: Prevent D2-2 certification from crossing manifest-owned removals
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'd2-2' && steps.delta.outputs.noop != '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          plan="$RUNNER_TEMP/fitcrew-deployment-proof/d2-3-delete-plan.tsv"
          if [[ -f "$plan" ]]; then
            count="$(grep -cve '^$' "$plan" || true)"
            [[ "$count" == '0' ]] || {
              echo "D2-2 is intentionally non-deleting and found $count obsolete Deployment-owned path(s)." >&2
              echo 'Run D2-3, review the exact manifest-owned delete plan, then D2-4.' >&2
              exit 1
            }
          elif [[ '${{ steps.delta.outputs.production_deleted }}' != '0' ]]; then
            echo 'Git reports production removals but no manifest retirement proof was created; refusing certification.' >&2
            exit 1
          fi

      - name: D2-3 — calculate exact manifest-owned deletion plan / NO DELETE
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'd2-3' || inputs.phase == 'd2-4') && steps.delta.outputs.noop != '1' }}
        shell: bash
        env:
          CERTIFIED_COMMIT: ${{ steps.cert_status.outputs.certified_commit }}
          MAIN_COMMIT: ${{ steps.main_source.outputs.commit }}
          PLAN_PHASE_LABEL: D2-3
        run: |
          set -Eeuo pipefail
          proof-repo/.github/deployment/deploy-v2-proof.sh manifest-delete-plan \
            "$RUNNER_TEMP/fitcrew-production-payload" \
            "$RUNNER_TEMP/fitcrew-deployment-proof"

      - name: D2-3 — prove zero deletion plan when target main is already certified
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'd2-3' && steps.delta.outputs.noop == '1' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          proof_dir="$RUNNER_TEMP/fitcrew-deployment-proof"
          : > "$proof_dir/d2-3-delete-plan.tsv"
          : > "$proof_dir/d2-3-delete-candidates.txt"
          tsv_sha="$(sha256sum "$proof_dir/d2-3-delete-plan.tsv" | awk '{print $1}')"
          commit='${{ steps.main_source.outputs.commit }}'
          identity="$(printf 'fitcrew-manifest-delete-plan-v1\ncertified_commit=%s\ntarget_main=%s\ndelete_plan_tsv_sha256=%s\n' \
            "$commit" "$commit" "$tsv_sha" | sha256sum | awk '{print $1}')"
          printf '%s\n' "$identity" > "$proof_dir/d2-3-delete-plan-identity.sha256"
          {
            echo
            echo '## D2-3 — Deployment-owned manifest deletion dry run'
            echo
            echo '- Certified commit equals target main: **PASS**'
            echo '- Candidate obsolete files: `0`'
            printf -- '- Exact delete-plan TSV SHA-256: `%s`\n' "$tsv_sha"
            printf -- '- Commit-bound delete-plan identity SHA-256: `%s`\n' "$identity"
            echo '- Production-root tree scan: **NOT PERFORMED**'
            echo '- Production deletion: **NONE / DRY RUN**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require non-empty D2-4 manifest-owned deletion proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'd2-4' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ steps.delta.outputs.noop }}' != '1' ]] || {
            echo 'D2-4 requires a nonzero target delta containing at least one obsolete Deployment-owned path.' >&2
            exit 1
          }
          count="$(grep -cve '^$' "$RUNNER_TEMP/fitcrew-deployment-proof/d2-3-delete-plan.tsv" || true)"
          [[ "$count" -gt 0 ]] || {
            echo 'D2-4 requires at least one manifest-owned deletion candidate.' >&2
            exit 1
          }

      - name: D2-2/D2-4 — Git-diff-scoped production transfer / no broad delete
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'd2-2' || inputs.phase == 'd2-4') && steps.delta.outputs.noop != '1' }}
        shell: bash
        env:
          MAIN_COMMIT: ${{ steps.main_source.outputs.commit }}
          VENDOR_FAST: ${{ steps.vendor_status.outputs.fast }}
          DEPLOY_PHASE_LABEL: ${{ inputs.phase == 'd2-4' && 'D2-4' || 'D2-2' }}
        run: |
          set -Eeuo pipefail
          if [[ "$VENDOR_FAST" == '1' && '${{ steps.delta.outputs.certified_chain }}' == '1' ]]; then
            export RSYNC_FILE_LIST="$RUNNER_TEMP/fitcrew-deployment-proof/changed-production-files.txt"
          fi
          proof-repo/.github/deployment/deploy-v2-proof.sh deploy \
            "$RUNNER_TEMP/fitcrew-production-payload" \
            "$RUNNER_TEMP/fitcrew-deployment-proof"

      - name: D2-4 — remove only exact manifest-owned obsolete files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'd2-4' && steps.delta.outputs.noop != '1' }}
        shell: bash
        env:
          EXPECTED_DELETE_PLAN_SHA256: ${{ inputs.deletion_plan_sha256 }}
        run: |
          set -Eeuo pipefail
          proof-repo/.github/deployment/deploy-v2-proof.sh manifest-delete-apply \
            "$RUNNER_TEMP/fitcrew-production-payload" \
            "$RUNNER_TEMP/fitcrew-deployment-proof"

      - name: D2-2/D2-4 — verify target payload and advance certification
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'd2-2' || inputs.phase == 'd2-4') && steps.delta.outputs.noop != '1' }}
        shell: bash
        env:
          MAIN_COMMIT: ${{ steps.main_source.outputs.commit }}
          CERTIFY_PHASE_LABEL: ${{ inputs.phase == 'd2-4' && 'D2-4' || 'D2-2' }}
        run: |
          set -Eeuo pipefail
          proof-repo/.github/deployment/deploy-v2-proof.sh verify-certify \
            "$RUNNER_TEMP/fitcrew-production-payload" \
            "$RUNNER_TEMP/fitcrew-deployment-proof"

      - name: D2-2/D2-4 — production HTTP and security smoke
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'd2-2' || inputs.phase == 'd2-4') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root_status="$(curl -sS -o /dev/null -w '%{http_code}' "$APP_URL/")"
          [[ "$root_status" == '200' ]] || {
            echo "Production root HTTP smoke failed: $root_status" >&2
            exit 1
          }
          for path in '/.env' '/.git/HEAD' '/.fitcrew-deployment/current.env'; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$APP_URL$path")"
            case "$status" in
              403|404) ;;
              *)
                echo "Security smoke failed for $path: HTTP $status" >&2
                exit 1
                ;;
            esac
          done
          {
            echo
            printf '## %s — HTTP/security smoke\n' '${{ inputs.phase == 'd2-4' && 'D2-4' || 'D2-2' }}'
            echo
            echo '- Production root HTTP 200: **PASS**'
            echo '- `.env` HTTP exposure: **BLOCKED**'
            echo '- `.git` HTTP exposure: **BLOCKED**'
            echo '- Deployment certification metadata HTTP exposure: **BLOCKED / OUTSIDE WEB ROOT**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve proof package for deletion proofs, deployments, or failures
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && (inputs.phase == 'd2-2' || inputs.phase == 'd2-3' || inputs.phase == 'd2-4')) }}
        uses: actions/upload-artifact@v4
        with:
          name: fitcrew-deployment-v2-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/fitcrew-deployment-proof/
          if-no-files-found: warn
          retention-days: 30
